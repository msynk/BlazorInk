name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore BlazorInk.sln

      - name: Build
        run: dotnet build BlazorInk.sln -c Release --no-restore

      # dotnet test takes one project at a time, so the two suites are separate commands.
      - name: Unit tests
        run: >
          dotnet test tests/BlazorInk.Core.Tests
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results
          --logger "trx;LogFileName=core-tests.trx"

      - name: Component tests
        run: >
          dotnet test tests/BlazorInk.Tests
          -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results
          --logger "trx;LogFileName=component-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./artifacts/test-results

      - name: Pack
        run: dotnet pack BlazorInk.sln -c Release --no-build -o ./artifacts/packages

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/packages/*.nupkg

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BlazorInk.sln -c Release

      - name: Install Playwright browsers
        run: pwsh tests/BlazorInk.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run browser tests
        run: >
          dotnet test tests/BlazorInk.E2E -c Release --no-build
          --logger "trx;LogFileName=e2e.trx"
          --results-directory ./artifacts/e2e-results

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: ./artifacts/e2e-results

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    # Benchmarks are informational: they run on demand rather than gating every change, because shared CI
    # hardware is too noisy to fail a build on.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run benchmarks
        run: >
          dotnet run --project tests/BlazorInk.Benchmarks -c Release --
          --filter "*" --job short --iterationCount 5 --warmupCount 2
          --artifacts ./artifacts/benchmarks

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: ./artifacts/benchmarks
